services:
  backend:
    build: .
    container_name: tro-backend
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/data/tro.db
      OTP_GTFS_URL: http://otp:8080/otp/gtfs/v1
      OTP_LONG_DISTANCE_URL: http://otp-long-distance:8080/otp/gtfs/v1
      # Optional. The backend degrades gracefully when the Europe profile is
      # stopped, so domestic searches do not require this larger graph.
      OTP_EUROPE_URL: http://otp-europe:8080/otp/gtfs/v1
      # Keep the station resolver aligned with the archive that produced the
      # running D-Ticket OTP graph.
      REGIONAL_GTFS_ARCHIVE_PATH: /app/otp-data/d-ticket/regional-d-ticket-gtfs.zip
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./otp-data:/app/otp-data:ro
    depends_on:
      otp:
        condition: service_started
      otp-long-distance:
        condition: service_started

  otp:
    image: docker.io/opentripplanner/opentripplanner:latest
    container_name: tro-otp
    command: ["--load", "--serve"]
    # Internal only: the backend is the sole component allowed to query OTP.
    expose:
      - "8080"
    volumes:
      - ./otp-data/d-ticket:/var/opentripplanner

  otp-build:
    image: docker.io/opentripplanner/opentripplanner:latest
    profiles: ["build"]
    command: ["--build", "--save"]
    volumes:
      - ./otp-data/d-ticket:/var/opentripplanner

  # Paid German long-distance rail graph.
  otp-long-distance:
    image: docker.io/opentripplanner/opentripplanner:latest
    container_name: tro-otp-long-distance
    command: ["--load", "--serve"]
    expose:
      - "8080"
    volumes:
      - ./otp-data/long-distance:/var/opentripplanner

  otp-long-distance-build:
    image: docker.io/opentripplanner/opentripplanner:latest
    profiles: ["long-distance-build"]
    command: ["--build", "--save"]
    volumes:
      - ./otp-data/long-distance:/var/opentripplanner

  # Optional European graph: currently France and Switzerland.
  otp-europe:
    image: docker.io/opentripplanner/opentripplanner:latest
    profiles: ["europe"]
    container_name: tro-otp-europe
    command: ["--load", "--serve"]
    environment:
      JAVA_TOOL_OPTIONS: "-Xms2g -Xmx6g"
    expose:
      - "8080"
    volumes:
      - ./otp-data/europe/rail:/var/opentripplanner

  # Builds the European graph file. Docker Desktop needs at least 6 GB RAM.
  otp-europe-build:
    image: docker.io/opentripplanner/opentripplanner:latest
    profiles: ["europe-build"]
    command: ["--build", "--save"]
    environment:
      JAVA_TOOL_OPTIONS: "-Xms2g -Xmx6g"
    volumes:
      - ./otp-data/europe/rail:/var/opentripplanner
