<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TRO - Travel Route Optimizer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>TRO</h1>
        <p>Travel Route Optimizer</p>
    </header>

    <main>

        <section id="input_info">

            <h2>Plan your journey</h2>

            <div class="input_group">

                <div class="input_field">
                    <label for="origin">Origin</label>
                    <input
                        type="text"
                        id="origin"
                        name="origin"
                        placeholder="e.g. Erfurt"
                    >
                </div>

                <div class="input_field">
                    <label for="destination">Destination</label>
                    <input
                        type="text"
                        id="destination"
                        name="destination"
                        placeholder="e.g. München"
                    >
                </div>

                <div class="input_field">
                    <label for="date">Date</label>
                    <input
                        type="date"
                        id="date"
                        name="date"
                    >
                </div>

            </div>

            <button id="search_button">
                Search routes
            </button>

        </section>


        <section id="output">

            <p class="empty_state">Search for a route to build its transport graph.</p>

        </section>

        <section id="graph_section" class="hidden">
            <div class="section_heading"><h2>3D graph</h2><button id="reset_graph_button" type="button">Reset view</button></div>
            <p>Drag to rotate, scroll to zoom. Nodes use geographic coordinates and lines show available connections.</p>
            <div id="graph_canvas"></div>
        </section>

    </main>

    <script src="https://unpkg.com/three@0.124.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.124.0/examples/js/controls/OrbitControls.js"></script>
    <script src="javascript.js"></script>

</body>
</html>
